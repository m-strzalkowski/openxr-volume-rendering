<!DOCTYPE html>
<html lang="pl">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
	<!-- Both of these are replaced by main.js as soon as the module runs; the
	     markup carries the default language so the page is never blank first. -->
	<title>Gęstość przyspieszeń 3D — XR</title>
	<style>
		* { box-sizing: border-box; }

		body {
			margin: 0;
			overflow: hidden;
			background: #0a0a0f;
			font: 13px/1.5 ui-monospace, "DejaVu Sans Mono", monospace;
			color: #a0a0aa;
		}

		#hud {
			position: fixed;
			top: 10px;
			left: 12px;
			z-index: 10;
			pointer-events: none;
			text-shadow: 0 1px 3px #000;
		}

		#hud b { color: #e8e8ee; font-weight: 600; }

		#hud .dim { color: #6a6a76; }

		#status {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			z-index: 10;
			padding: 14px 20px;
			border: 1px solid #33333f;
			border-radius: 6px;
			background: #14141ce0;
			color: #d0d0d8;
		}

		#status.err { border-color: #a33; color: #f0b0b0; }

		#status.hidden { display: none; }

		/* The instructions and the vehicle controls share one column, so the
		   buttons sit under the text whatever length the text turns out to be.
		   The column itself must not eat pointer events: the empty part of it
		   is over the canvas, and that is where the camera is dragged. */
		#right-col {
			position: fixed;
			top: 10px;
			right: 14px;
			z-index: 15;
			display: flex;
			flex-direction: column;
			align-items: flex-end;
			gap: 14px;
			pointer-events: none;
		}

		#right-col > * { pointer-events: auto; }

		#help {
			margin: 0;
			white-space: pre;
			font: 12px/1.5 ui-monospace, "DejaVu Sans Mono", monospace;
			color: #8b8b98;
			text-shadow: 0 1px 3px #000;
			pointer-events: none;
		}

		#ctl-left,
		#ctl-right {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		#ctl-left {
			position: fixed;
			left: 12px;
			top: 50%;
			transform: translateY(-50%);
			z-index: 15;
		}

		/* The same plate as the in-scene controls, in the same three states:
		   grey at rest, light blue under the finger. */
		.ctl-btn {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			min-width: 48px;
			min-height: 48px;
			padding: 10px 12px;
			border: 1px solid rgba(255, 255, 255, 0.45);
			border-radius: 3px;
			background: rgba(10, 10, 20, 0.45);
			/* Dimmed through the text colour, NOT through opacity: opacity fades
			   the whole box including the flag, and a translucent flag looks
			   broken rather than subdued. A colour emoji carries its own palette
			   and ignores `color`, so the flag stays fully saturated while the
			   label and border sit back at half strength. */
			color: rgba(255, 255, 255, 0.72);
			/* the emoji family is named first: fallback is per character, and
			   neither the mono nor the sans faces carry regional indicators */
			font: 600 18px/1 "Noto Color Emoji", ui-monospace, "DejaVu Sans Mono", monospace;
			cursor: pointer;
			outline: none;
			user-select: none;
			touch-action: manipulation;   /* no double-tap zoom on a phone */
		}

		.ctl-btn .w {
			font-size: 13px;
			font-weight: 400;
		}

		.ctl-btn:hover {
			color: #fff;
			border-color: #fff;
		}

		.ctl-btn:active {
			border-color: #9fd0ff;
			background: rgba(127, 182, 255, 0.35);
			color: #fff;
		}

		/* One row, so widths that change -- "START AR" against "AR NOT
		   SUPPORTED" -- cannot land on top of each other. */
		#xr-bar {
			position: fixed;
			bottom: 20px;
			left: 50%;
			transform: translateX(-50%);
			z-index: 20;
			display: flex;
			align-items: stretch;
			gap: 10px;
		}

		/* three's XR buttons position themselves absolutely and re-set left and
		   width from an async support check, so pulling them into the row has to
		   outrank the inline style. */
		#xr-bar > button[id$="-btn"]:not(.ctl-btn),
		#ar-btn,
		#vr-btn {
			position: static !important;
			left: auto !important;
			bottom: auto !important;
			width: auto !important;
			min-width: 116px;
			padding: 12px 14px !important;
			border-color: rgba(255, 255, 255, 0.45) !important;
			border-radius: 3px !important;
			background: rgba(10, 10, 20, 0.45) !important;
			font: 600 13px/1 ui-monospace, "DejaVu Sans Mono", monospace !important;
			opacity: 0.85 !important;
		}

		#xr-none {
			display: flex;
			align-items: center;
			white-space: nowrap;
			padding: 12px 14px;
			border: 1px solid rgba(255, 255, 255, 0.2);
			border-radius: 3px;
			color: rgba(255, 255, 255, 0.4);
			font: 400 13px/1 ui-monospace, "DejaVu Sans Mono", monospace;
		}

		/* In a session the HTML controls would float in front of the viewer,
		   duplicating the ones now drawn in the scene. The readout and the
		   instructions stay: in AR they are the dom-overlay. */
		body.presenting #ctl-left,
		body.presenting #ctl-right,
		body.presenting #lang-btn { display: none; }

		/* The bare view (left squeeze + Y, or `v` on a keyboard): nothing but the
		   cloud. In AR the dom-overlay is the readout, so it goes too. The XR
		   bar stays -- the way out of a session should never be hard to find. */
		body.bare #hud,
		body.bare #help,
		body.bare #ctl-left,
		body.bare #ctl-right,
		body.bare #lang-btn { display: none; }

		/* No room for the reading matter: the picture and two columns of glyphs
		   at the edges, nothing else. Keyed on `compact`, which is measured, not
		   on which device this is taken to be -- a narrow window has the same
		   problem, and a phone we failed to recognise still has to be legible.

		   The menu button goes here AND on the headset's flat page: the list is
		   driven by the arrow keys, and neither has a keyboard. */
		[data-compact="1"] #hud,
		[data-compact="1"] #help,
		[data-compact="1"] .ctl-btn .w,
		[data-compact="1"] .menu-btn,
		[data-platform="headset"] .menu-btn { display: none; }

		[data-compact="1"] #ctl-left { left: 8px; }

		[data-compact="1"] #right-col {
			top: 50%;
			right: 8px;
			transform: translateY(-50%);
		}

		[data-compact="1"] .ctl-btn {
			min-width: 44px;
			min-height: 44px;
			padding: 6px;
			font-size: 20px;
		}

		[data-compact="1"] #xr-bar { bottom: 12px; }

		[data-compact="1"] #xr-none,
		[data-compact="1"] #ar-btn,
		[data-compact="1"] #vr-btn {
			min-width: 0;
			padding: 10px 12px !important;
			font-size: 12px !important;
		}
	</style>
</head>

<body>
	<div id="status">ładuję wolumen…</div>
	<div id="hud"></div>
	<!-- Filled by page.js: the labels are localised and the XR buttons depend on
	     what the device turns out to support, so only the frames live here. -->
	<div id="right-col">
		<pre id="help"></pre>
		<div id="ctl-right"></div>
	</div>
	<div id="ctl-left"></div>
	<div id="xr-bar"></div>
	<script type="importmap">
		{
			"imports": {
				"three": "./vendor/three.module.js",
				"three/addons/": "./vendor/addons/"
			}
		}
	</script>
	<script type="module" src="./main.js"></script>
</body>

</html>
